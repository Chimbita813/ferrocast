name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test -p ferrocast-core -p ferrocast-media --lib
      - run: cargo build --release -p ferrocast
      - uses: actions/upload-artifact@v4
        with:
          name: ferrocast-windows-x64
          path: target/release/ferrocast.exe

  media-interop:
    name: Muxer and RTMP tests against FFmpeg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test -p ferrocast-core -p ferrocast-media

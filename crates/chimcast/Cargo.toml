[package]
name = "chimcast"
description = "Lightweight streaming and recording app for Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "chimcast"
path = "src/main.rs"

[dependencies]
chimcast-core.workspace = true
log.workspace = true

[target.'cfg(windows)'.dependencies]
chimcast-media.workspace = true
chimcast-win.workspace = true
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "0.37", default-features = false }
winit = "0.30"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
] }


[build-dependencies]
winresource = "0.1"

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
chimcast-core = { path = "crates/chimcast-core" }
chimcast-media = { path = "crates/chimcast-media" }
chimcast-win = { path = "crates/chimcast-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3
